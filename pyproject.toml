[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toc_llm"
version = "0.1.0"
description = "Package to run experiments for generating table-of-contents."
readme = "README.md"
authors = [
  { name = "Steffen Freisinger", email = "firstname.lastname@gmail.com" }
]
license = "MIT"
dependencies = [
  "unsloth==2025.2.4",
  "unsloth-zoo==2025.2.3",
  "torch==2.6.0",
  "transformers==4.46.3",
  "scikit-learn==1.7.0",
  "segeval==2.0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toc_llm"]
exclude = ["models"]
